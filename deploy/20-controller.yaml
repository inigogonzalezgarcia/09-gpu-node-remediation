# Single replica with Recreate: there is no leader election, so two copies must never run at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-remediation
  namespace: gpu-remediation
  labels: {app.kubernetes.io/name: gpu-remediation}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: gpu-remediation}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gpu-remediation}
    spec:
      serviceAccountName: gpu-remediation
      # Never on a GPU node: the controller must not drain itself.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: IMAGE
          imagePullPolicy: IfNotPresent
          args:
            - controller
            - -node-selector=nvidia.com/gpu.present=true
            - -max-unavailable=1
            - -interval=3s
            - -clear-checks=2
            - -validation-timeout=90s
            - -validation-gpus=8
            - -validation-image=VALIDATION_IMAGE
            - -repeat-limit=2
            - -repeat-window=1h
            - -temp-cordon=90
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {name: metrics, containerPort: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-remediation
  namespace: gpu-remediation
  labels: {app.kubernetes.io/name: gpu-remediation}
spec:
  selector: {app.kubernetes.io/name: gpu-remediation}
  ports:
    - {name: metrics, port: 8080, targetPort: metrics}
