# Lab only: stands in for dcgm-exporter on nodes without GPUs. Same port (9400) and metric names.
# hostNetwork so the controller and the validation Job reach it on the node's IP, like a node agent.
# Own namespace: hostNetwork is not allowed by the "baseline" Pod Security level the controller's namespace enforces.
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-telemetry
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-sim
  namespace: gpu-telemetry
  labels: {app.kubernetes.io/name: gpu-sim}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: gpu-sim}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gpu-sim}
    spec:
      hostNetwork: true
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - operator: Exists
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gpu-sim
          image: IMAGE
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/gpu-sim", "-listen=:9400", "-gpus=8"]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          readinessProbe:
            httpGet: {path: /healthz, port: 9400}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
